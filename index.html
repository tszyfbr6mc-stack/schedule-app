<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#5c7cfa">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="학습 시간표">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>학습 시간표</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #5c7cfa;
    --primary-dark: #3b5bdb;
    --bg: #f0f4ff;
    --card: #fff;
    --math: linear-gradient(135deg, #667eea, #764ba2);
    --english: linear-gradient(135deg, #f093fb, #f5576c);
    --korean: linear-gradient(135deg, #4facfe, #00c6fb);
    --piano: linear-gradient(135deg, #43e97b, #38f9d7);
    --dictation: linear-gradient(135deg, #fa709a, #fee140);
    --school: linear-gradient(135deg, #ff9a9e, #fad0c4);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    padding-bottom: 32px;
  }

  .header {
    background: var(--primary);
    padding: calc(52px + env(safe-area-inset-top)) 20px 20px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 20px rgba(92,124,250,0.3);
  }

  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }

  .app-title {
    font-size: 20px;
    font-weight: 900;
    color: #fff;
    letter-spacing: 0;
  }

  .app-sub {
    font-family: 'Nanum Pen Script', cursive;
    font-size: 14px;
    color: rgba(255,255,255,0.75);
    margin-top: 1px;
  }

  .week-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(255,255,255,0.15);
    border-radius: 14px;
    padding: 10px 16px;
  }

  .week-nav button {
    background: rgba(255,255,255,0.2);
    border: none;
    color: #fff;
    font-size: 18px;
    width: 36px;
    height: 36px;
    border-radius: 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s;
  }

  .week-nav button:active { background: rgba(255,255,255,0.35); }

  .week-label {
    font-size: 15px;
    font-weight: 900;
    color: #fff;
    text-align: center;
    flex: 1;
  }

  .week-label span {
    display: block;
    font-size: 11px;
    font-weight: 400;
    opacity: 0.75;
    margin-top: 2px;
  }

  .progress-wrap {
    margin-top: 12px;
    background: rgba(255,255,255,0.2);
    border-radius: 10px;
    height: 6px;
    overflow: hidden;
  }

  .progress-bar {
    height: 100%;
    background: #fff;
    border-radius: 10px;
    transition: width 0.4s ease;
  }

  .progress-text {
    font-size: 11px;
    color: rgba(255,255,255,0.8);
    margin-top: 5px;
    text-align: right;
  }

  .content {
    padding: 16px 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .day-card {
    background: var(--card);
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    transition: transform 0.1s;
  }

  .day-header {
    display: flex;
    align-items: center;
    padding: 12px 16px;
    border-bottom: 1.5px solid #f5f5f5;
    gap: 12px;
  }

  .day-badge {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .day-badge .kor { font-size: 17px; font-weight: 900; color: #333; }
  .day-badge .eng { font-size: 9px; color: #aaa; margin-top: -1px; }
  .day-badge.weekend .kor { color: #ff6b6b; }

  .day-date-label {
    flex: 1;
    font-size: 13px;
    color: #aaa;
    font-weight: 400;
  }

  .day-complete-badge {
    font-size: 11px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 20px;
    background: #e8fef0;
    color: #2ecc71;
    display: none;
  }

  .day-complete-badge.show { display: block; }

  .day-tasks {
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .task-item {
    display: flex;
    align-items: center;
    gap: 12px;
    border-radius: 12px;
    padding: 11px 14px;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
    user-select: none;
  }

  .task-item:active { transform: scale(0.98); }
  .task-item.partial { box-shadow: inset 0 0 0 3px rgba(255,255,255,0.36); }
  .task-item.done { opacity: 0.55; }

  .task-checkbox {
    width: 26px;
    height: 26px;
    border-radius: 8px;
    border: 2.5px solid rgba(255,255,255,0.6);
    background: rgba(255,255,255,0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 15px;
    transition: all 0.2s;
  }

  .task-item.done .task-checkbox { background: rgba(255,255,255,0.45); }

  .task-text { flex: 1; }
  .task-name { font-size: 13px; font-weight: 900; color: #fff; }
  .task-detail { font-size: 11px; color: rgba(255,255,255,0.8); margin-top: 1px; }
  .task-progress { font-size: 11px; color: #fff; font-weight: 900; margin-top: 4px; }

  .t-math       { background: var(--math); }
  .t-english    { background: var(--english); }
  .t-korean     { background: var(--korean); }
  .t-piano      { background: var(--piano); }
  .t-dictation  { background: var(--dictation); }
  .t-school     { background: var(--school); }
  .t-buffer     { background: #f5f5f5; border: 2px dashed #ddd; }
  .t-buffer .task-name { color: #999; }
  .t-buffer .task-detail { color: #bbb; }
  .t-buffer .task-checkbox { border-color: #ccc; background: #eee; }

  .sunday-note {
    font-size: 11.5px;
    color: #bbb;
    padding: 4px 14px 10px;
    font-style: italic;
  }

  .action-links {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin: 8px 14px 0;
  }

  .action-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: #fff;
    border: 1.5px solid #e0e5ff;
    border-radius: 14px;
    padding: 13px;
    font-size: 13px;
    font-weight: 700;
    color: var(--primary);
    cursor: pointer;
    transition: background 0.15s;
    text-decoration: none;
  }

  .action-btn:active { background: #f0f4ff; }

  .print-btn {
    background: var(--primary-dark);
    border-color: var(--primary-dark);
    color: #fff;
  }

  .print-btn:active { background: var(--primary); }

  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    z-index: 200;
    align-items: flex-end;
  }

  .modal-overlay.open { display: flex; }

  .modal {
    background: #fff;
    border-radius: 24px 24px 0 0;
    width: 100%;
    max-height: 70vh;
    overflow-y: auto;
    padding: 24px 20px calc(40px + env(safe-area-inset-bottom));
    animation: slideUp 0.25s ease;
  }

  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }

  .modal-handle {
    width: 40px; height: 4px;
    background: #ddd;
    border-radius: 2px;
    margin: 0 auto 20px;
  }

  .modal-title {
    font-size: 17px;
    font-weight: 900;
    color: #333;
    margin-bottom: 16px;
  }

  .history-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 13px 0;
    border-bottom: 1px solid #f5f5f5;
  }

  .history-row:last-child { border-bottom: none; }
  .history-week {
    width: 68px;
    flex-shrink: 0;
    font-size: 13px;
    font-weight: 700;
    color: #333;
  }

  .history-rate {
    width: 38px;
    flex-shrink: 0;
    font-size: 13px;
    font-weight: 900;
    color: var(--primary);
    text-align: right;
  }

  .history-bar-wrap {
    flex: 1;
    background: #f0f0f0;
    border-radius: 4px;
    height: 6px;
  }

  .history-bar {
    height: 100%;
    background: var(--primary);
    border-radius: 4px;
  }

  .history-delete {
    flex-shrink: 0;
    border: 1px solid #ffd1d1;
    background: #fff5f5;
    color: #ff5f5f;
    border-radius: 8px;
    padding: 6px 8px;
    font-size: 11px;
    font-weight: 800;
    font-family: 'Noto Sans KR', sans-serif;
    cursor: pointer;
  }

  .history-delete:active {
    background: #ffe8e8;
  }

  .modal-close {
    width: 100%;
    margin-top: 20px;
    padding: 14px;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 14px;
    font-size: 15px;
    font-weight: 700;
    font-family: 'Noto Sans KR', sans-serif;
    cursor: pointer;
  }

  .empty-history {
    text-align: center;
    color: #bbb;
    font-size: 13px;
    padding: 30px 0;
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div>
      <div class="app-title">📅 학습 시간표</div>
      <div class="app-sub">매일 체크하면서 실력을 키워요!</div>
    </div>
  </div>
  <div class="week-nav">
    <button onclick="changeWeek(-1)" aria-label="이전 주">‹</button>
    <div class="week-label" id="weekLabel">
      이번 주
      <span id="weekRange"></span>
    </div>
    <button onclick="changeWeek(1)" aria-label="다음 주">›</button>
  </div>
  <div class="progress-wrap">
    <div class="progress-bar" id="progressBar" style="width:0%"></div>
  </div>
  <div class="progress-text" id="progressText">0% 진행</div>
</div>

<div class="content" id="content"></div>

<div class="action-links">
  <a class="action-btn print-btn" href="print-4weeks.html">
    🖨️ 4주 시간표 출력하기
  </a>
  <div class="action-btn" onclick="openHistory()">
    📊 지난 주 기록 보기
  </div>
</div>

<div class="modal-overlay" id="modalOverlay" onclick="closeHistory(event)">
  <div class="modal" id="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">📊 주간 완료 기록</div>
    <div id="historyList"></div>
    <button class="modal-close" onclick="closeHistory()">닫기</button>
  </div>
</div>

<script>
const SCHEDULE = [
  {
    day: '월', eng: 'MON', weekend: false,
    tasks: [
      { id: 'english', icon: '📖', name: '영어 리딩', detail: '1시간', target: 60, unit: '분', color: 't-english' },
      { id: 'korean',  icon: '✏️', name: '국어 숙제',  detail: '30분',  target: 30, unit: '분', color: 't-korean' },
      { id: 'math',    icon: '🔢', name: '수학 만점왕', detail: '4쪽',   target: 4, unit: '쪽', color: 't-math'  },
    ]
  },
  {
    day: '화', eng: 'TUE', weekend: false,
    tasks: [
      { id: 'math',  icon: '🔢', name: '수학 만점왕', detail: '2쪽',  target: 2, unit: '쪽', color: 't-math'  },
      { id: 'piano', icon: '🎹', name: '피아노 학원', detail: '1시간', target: 60, unit: '분', color: 't-piano' },
    ]
  },
  {
    day: '수', eng: 'WED', weekend: false,
    tasks: [
      { id: 'english', icon: '📖', name: '영어 리딩', detail: '1시간', target: 60, unit: '분', color: 't-english' },
      { id: 'korean',  icon: '✏️', name: '국어 숙제',  detail: '30분',  target: 30, unit: '분', color: 't-korean' },
      { id: 'math',    icon: '🔢', name: '수학 만점왕', detail: '4쪽',   target: 4, unit: '쪽', color: 't-math'  },
    ]
  },
  {
    day: '목', eng: 'THU', weekend: false,
    tasks: [
      { id: 'math',  icon: '🔢', name: '수학 만점왕', detail: '2쪽',  target: 2, unit: '쪽', color: 't-math'  },
      { id: 'piano', icon: '🎹', name: '피아노 학원', detail: '1시간', target: 60, unit: '분', color: 't-piano' },
    ]
  },
  {
    day: '금', eng: 'FRI', weekend: false,
    tasks: [
      { id: 'english',   icon: '📖', name: '영어 리딩',    detail: '1시간', target: 60, unit: '분', color: 't-english'   },
      { id: 'dictation', icon: '🖊️', name: '받아쓰기 준비', detail: '확인용', color: 't-dictation' },
      { id: 'math',      icon: '🔢', name: '수학 만점왕',   detail: '4쪽',   target: 4, unit: '쪽', color: 't-math'      },
    ]
  },
  {
    day: '토', eng: 'SAT', weekend: true,
    tasks: [
      { id: 'school', icon: '🏫', name: '한글학교', detail: '종일', color: 't-school' },
    ]
  },
  {
    day: '일', eng: 'SUN', weekend: true,
    tasks: [
      { id: 'buffer', icon: '📝', name: '밀린 숙제', detail: '필요시', color: 't-buffer' },
    ],
    note: '이번 주 못한 것들 마무리하는 날 💪'
  },
];

function getMondayOf(date) {
  const d = new Date(date);
  const day = d.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  d.setDate(d.getDate() + diff);
  d.setHours(0,0,0,0);
  return d;
}

function weekKey(monday) {
  return `week_${monday.getFullYear()}-${String(monday.getMonth() + 1).padStart(2, '0')}-${String(monday.getDate()).padStart(2, '0')}`;
}

function formatWeekRange(monday) {
  const sun = new Date(monday);
  sun.setDate(monday.getDate() + 6);
  const fmt = d => `${d.getMonth()+1}/${d.getDate()}`;
  return `${fmt(monday)} ~ ${fmt(sun)}`;
}

function formatDate(monday, offset) {
  const d = new Date(monday);
  d.setDate(monday.getDate() + offset);
  return `${d.getMonth()+1}월 ${d.getDate()}일`;
}

let currentMonday = getMondayOf(new Date());

function loadData(monday) {
  const key = weekKey(monday);
  const raw = localStorage.getItem(key);
  return raw ? JSON.parse(raw) : {};
}

function saveData(monday, data) {
  localStorage.setItem(weekKey(monday), JSON.stringify(data));
}

function taskAmount(task, value) {
  if (task.target) {
    if (value === true) return task.target;
    const amount = Number(value);
    return Number.isFinite(amount) ? Math.max(0, amount) : 0;
  }
  return value ? 1 : 0;
}

function taskRatio(task, value) {
  if (task.target) {
    return Math.min(taskAmount(task, value) / task.target, 1);
  }
  return value ? 1 : 0;
}

function taskStatus(task, value) {
  const ratio = taskRatio(task, value);
  if (ratio >= 1) return 'done';
  if (ratio > 0) return 'partial';
  return 'empty';
}

function taskProgressText(task, value) {
  if (!task.target) return '';
  const amount = taskAmount(task, value);
  return `${amount} / ${task.target}${task.unit}`;
}

function editTaskAmount(monday, task, key) {
  const data = loadData(monday);

  if (!task.target) {
    data[key] = !data[key];
    saveData(monday, data);
    render();
    return;
  }

  const current = taskAmount(task, data[key]);
  const answer = prompt(`${task.name}\n목표: ${task.target}${task.unit}\n오늘 한 양을 입력해 주세요.`, current || '');
  if (answer === null) return;

  const amount = Math.min(Math.max(Number(answer), 0), task.target);
  if (!Number.isFinite(amount)) {
    alert('숫자로 입력해 주세요.');
    return;
  }

  if (amount === 0) {
    delete data[key];
  } else {
    data[key] = amount;
  }
  saveData(monday, data);
  render();
}

function render() {
  const data = loadData(currentMonday);
  const content = document.getElementById('content');
  content.innerHTML = '';

  let totalTasks = 0, progressSum = 0;

  SCHEDULE.forEach((dayDef, di) => {
    const card = document.createElement('div');
    card.className = 'day-card';

    const dayDone = dayDef.tasks.filter(t => taskStatus(t, data[`${di}_${t.id}`]) === 'done').length;
    const dayTotal = dayDef.tasks.length;
    totalTasks += dayTotal;
    dayDef.tasks.forEach(t => {
      progressSum += taskRatio(t, data[`${di}_${t.id}`]);
    });
    const allDone = dayDone === dayTotal;

    const dateStr = formatDate(currentMonday, di);
    card.innerHTML = `
      <div class="day-header">
        <div class="day-badge${dayDef.weekend ? ' weekend' : ''}">
          <span class="kor">${dayDef.day}</span>
          <span class="eng">${dayDef.eng}</span>
        </div>
        <div class="day-date-label">${dateStr}</div>
        <div class="day-complete-badge${allDone ? ' show' : ''}">✓ 완료!</div>
      </div>
    `;

    const tasksDiv = document.createElement('div');
    tasksDiv.className = 'day-tasks';

    dayDef.tasks.forEach(task => {
      const key = `${di}_${task.id}`;
      const value = data[key];
      const status = taskStatus(task, value);
      const progressText = taskProgressText(task, value);
      const item = document.createElement('div');
      item.className = `task-item ${task.color}${status !== 'empty' ? ` ${status}` : ''}`;
      item.innerHTML = `
        <div class="task-checkbox">${status === 'done' ? '✓' : status === 'partial' ? '…' : ''}</div>
        <div class="task-text">
          <div class="task-name">${task.icon} ${task.name}</div>
          <div class="task-detail">${task.detail}</div>
          ${progressText ? `<div class="task-progress">${progressText}</div>` : ''}
        </div>
      `;
      item.addEventListener('click', () => {
        editTaskAmount(currentMonday, task, key);
      });
      tasksDiv.appendChild(item);
    });

    card.appendChild(tasksDiv);

    if (dayDef.note) {
      const note = document.createElement('div');
      note.className = 'sunday-note';
      note.textContent = dayDef.note;
      card.appendChild(note);
    }

    content.appendChild(card);
  });

  const pct = totalTasks ? Math.round(progressSum / totalTasks * 100) : 0;
  document.getElementById('progressBar').style.width = pct + '%';
  document.getElementById('progressText').textContent = `${pct}% 진행`;

  const isThisWeek = weekKey(currentMonday) === weekKey(getMondayOf(new Date()));
  document.getElementById('weekLabel').childNodes[0].textContent = isThisWeek ? '이번 주 ' : '주간 기록 ';
  document.getElementById('weekRange').textContent = formatWeekRange(currentMonday);
}

function changeWeek(dir) {
  currentMonday = getMondayOf(new Date(currentMonday.getTime() + dir * 7 * 24 * 60 * 60 * 1000));
  render();
}

function openHistory() {
  const list = document.getElementById('historyList');
  list.innerHTML = '';

  const keys = [];
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k.startsWith('week_')) keys.push(k);
  }
  keys.sort().reverse();

  if (keys.length === 0) {
    list.innerHTML = '<div class="empty-history">아직 기록이 없어요 😊</div>';
  } else {
    keys.forEach(k => {
      const data = JSON.parse(localStorage.getItem(k));
      const parts = k.replace('week_', '').split('-').map(Number);
      const monday = new Date(parts[0], parts[1] - 1, parts[2]);
      const range = formatWeekRange(monday);

      let total = 0, progress = 0;
      SCHEDULE.forEach((d, di) => {
        d.tasks.forEach(t => {
          total++;
          progress += taskRatio(t, data[`${di}_${t.id}`]);
        });
      });
      const pct = total ? Math.round(progress / total * 100) : 0;

      const row = document.createElement('div');
      row.className = 'history-row';
      row.innerHTML = `
        <div class="history-week">${range}</div>
        <div class="history-bar-wrap"><div class="history-bar" style="width:${pct}%"></div></div>
        <div class="history-rate">${pct}%</div>
        <button class="history-delete" type="button" data-week-key="${k}" data-week-range="${range}">삭제</button>
      `;
      list.appendChild(row);
    });
  }

  document.getElementById('modalOverlay').classList.add('open');
}

document.getElementById('historyList').addEventListener('click', event => {
  const button = event.target.closest('.history-delete');
  if (!button) return;

  const key = button.dataset.weekKey;
  const range = button.dataset.weekRange;
  const ok = confirm(`${range} 기록을 삭제할까요?`);
  if (!ok) return;

  localStorage.removeItem(key);
  openHistory();
  render();
});

function closeHistory(e) {
  if (!e || e.target === document.getElementById('modalOverlay')) {
    document.getElementById('modalOverlay').classList.remove('open');
  }
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js').catch(() => {});
  });
}

render();
</script>
</body>
</html>
