<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>학습 시간표 4주 출력</title>
<style>
  :root {
    --ink: #222;
    --muted: #777;
    --line: #cfd6e6;
    --soft: #f3f6ff;
    --primary: #5c7cfa;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    color: var(--ink);
    background: #eef2ff;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }

  .toolbar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 18px;
    background: #fff;
    border-bottom: 1px solid #dfe5f5;
    position: sticky;
    top: 0;
    z-index: 5;
  }

  .toolbar label {
    font-size: 14px;
    font-weight: 700;
  }

  .toolbar input,
  .toolbar button {
    height: 36px;
    border-radius: 8px;
    border: 1px solid #cfd6e6;
    font: inherit;
  }

  .toolbar input {
    padding: 0 10px;
  }

  .toolbar button {
    border: 0;
    background: var(--primary);
    color: #fff;
    font-weight: 800;
    padding: 0 14px;
    cursor: pointer;
  }

  .page {
    width: 210mm;
    min-height: 297mm;
    margin: 18px auto;
    padding: 8mm;
    background: #fff;
    box-shadow: 0 12px 40px rgba(46, 62, 105, 0.18);
  }

  .sheet-title {
    display: flex;
    align-items: end;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 4mm;
    border-bottom: 2px solid var(--primary);
    padding-bottom: 2.5mm;
  }

  h1 {
    margin: 0;
    font-size: 18pt;
    line-height: 1;
    letter-spacing: 0;
  }

  .subtitle {
    color: var(--muted);
    font-size: 9pt;
    font-weight: 700;
    white-space: nowrap;
  }

  .weeks {
    display: grid;
    grid-template-rows: repeat(4, 1fr);
    gap: 3mm;
  }

  .week {
    border: 1.4px solid var(--line);
    border-radius: 4px;
    overflow: hidden;
    break-inside: avoid;
  }

  .week-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--primary);
    color: #fff;
    padding: 2mm 3mm;
  }

  .week-title {
    font-size: 11pt;
    font-weight: 900;
  }

  .week-range {
    font-size: 8.5pt;
    font-weight: 700;
    opacity: 0.9;
  }

  .days {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
  }

  .day {
    min-height: 44mm;
    border-right: 1px solid var(--line);
    background: #fff;
  }

  .day:last-child {
    border-right: 0;
  }

  .day.weekend {
    background: #fff7f7;
  }

  .day-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 2mm;
    padding: 1.6mm 2mm;
    background: var(--soft);
    border-bottom: 1px solid var(--line);
  }

  .weekend .day-head {
    background: #ffe9e9;
  }

  .day-name {
    font-size: 9pt;
    font-weight: 900;
  }

  .date {
    color: var(--muted);
    font-size: 7.5pt;
    font-weight: 700;
  }

  .tasks {
    display: flex;
    flex-direction: column;
    gap: 1.2mm;
    padding: 2mm;
  }

  .task {
    display: grid;
    grid-template-columns: 4.3mm 1fr;
    gap: 1.4mm;
    align-items: start;
    min-height: 7mm;
    font-size: 7.7pt;
    line-height: 1.18;
  }

  .box {
    width: 3.7mm;
    height: 3.7mm;
    border: 1.4px solid #555;
    border-radius: 1px;
    margin-top: 0.4mm;
  }

  .task-name {
    font-weight: 850;
    word-break: keep-all;
  }

  .task-detail {
    color: var(--muted);
    font-size: 7pt;
    margin-top: 0.4mm;
  }

  .note {
    margin: 0 2mm 2mm;
    padding-top: 1.2mm;
    border-top: 1px dashed #d8d8d8;
    color: var(--muted);
    font-size: 6.8pt;
    line-height: 1.2;
  }

  @page {
    size: A4 portrait;
    margin: 0;
  }

  @media print {
    body {
      background: #fff;
    }

    .toolbar {
      display: none;
    }

    .page {
      width: 210mm;
      min-height: 297mm;
      margin: 0;
      padding: 7mm;
      box-shadow: none;
    }

    .weeks {
      gap: 2.5mm;
    }

    .week {
      border-color: #999;
    }
  }
</style>
</head>
<body>
  <div class="toolbar">
    <label for="startDate">시작 주</label>
    <input id="startDate" type="date">
    <button type="button" onclick="renderFromPicker()">적용</button>
    <button type="button" onclick="window.print()">인쇄</button>
  </div>

  <main class="page">
    <header class="sheet-title">
      <h1>학습 시간표</h1>
      <div class="subtitle" id="sheetRange"></div>
    </header>
    <section class="weeks" id="weeks"></section>
  </main>

<script>
const SCHEDULE = [
  {
    day: '월', weekend: false,
    tasks: [
      { name: '영어 리딩', detail: '1시간' },
      { name: '국어 숙제', detail: '30분' },
      { name: '수학 만점왕', detail: '4쪽' },
    ]
  },
  {
    day: '화', weekend: false,
    tasks: [
      { name: '수학 만점왕', detail: '2쪽' },
      { name: '피아노 학원', detail: '1시간' },
    ]
  },
  {
    day: '수', weekend: false,
    tasks: [
      { name: '영어 리딩', detail: '1시간' },
      { name: '국어 숙제', detail: '30분' },
      { name: '수학 만점왕', detail: '4쪽' },
    ]
  },
  {
    day: '목', weekend: false,
    tasks: [
      { name: '수학 만점왕', detail: '2쪽' },
      { name: '피아노 학원', detail: '1시간' },
    ]
  },
  {
    day: '금', weekend: false,
    tasks: [
      { name: '영어 리딩', detail: '1시간' },
      { name: '받아쓰기 준비', detail: '확인용' },
      { name: '수학 만점왕', detail: '4쪽' },
    ]
  },
  {
    day: '토', weekend: true,
    tasks: [
      { name: '한글학교', detail: '종일' },
    ]
  },
  {
    day: '일', weekend: true,
    tasks: [
      { name: '밀린 숙제', detail: '필요시' },
    ],
    note: '이번 주 못한 것들 마무리'
  },
];

function getMondayOf(date) {
  const d = new Date(date);
  const day = d.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  d.setDate(d.getDate() + diff);
  d.setHours(0, 0, 0, 0);
  return d;
}

function addDays(date, days) {
  const d = new Date(date);
  d.setDate(d.getDate() + days);
  return d;
}

function formatShort(date) {
  return `${date.getMonth() + 1}/${date.getDate()}`;
}

function formatInputDate(date) {
  return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
}

function render(startMonday) {
  const weeks = document.getElementById('weeks');
  weeks.innerHTML = '';

  const finalSunday = addDays(startMonday, 27);
  document.getElementById('sheetRange').textContent = `${formatShort(startMonday)} ~ ${formatShort(finalSunday)}`;

  for (let weekIndex = 0; weekIndex < 4; weekIndex++) {
    const monday = addDays(startMonday, weekIndex * 7);
    const sunday = addDays(monday, 6);
    const week = document.createElement('article');
    week.className = 'week';
    week.innerHTML = `
      <div class="week-head">
        <div class="week-title">${weekIndex + 1}주차</div>
        <div class="week-range">${formatShort(monday)} ~ ${formatShort(sunday)}</div>
      </div>
      <div class="days"></div>
    `;

    const days = week.querySelector('.days');

    SCHEDULE.forEach((day, dayIndex) => {
      const date = addDays(monday, dayIndex);
      const dayEl = document.createElement('div');
      dayEl.className = `day${day.weekend ? ' weekend' : ''}`;
      dayEl.innerHTML = `
        <div class="day-head">
          <div class="day-name">${day.day}</div>
          <div class="date">${formatShort(date)}</div>
        </div>
        <div class="tasks">
          ${day.tasks.map(task => `
            <div class="task">
              <div class="box"></div>
              <div>
                <div class="task-name">${task.name}</div>
                <div class="task-detail">${task.detail}</div>
              </div>
            </div>
          `).join('')}
        </div>
        ${day.note ? `<div class="note">${day.note}</div>` : ''}
      `;
      days.appendChild(dayEl);
    });

    weeks.appendChild(week);
  }
}

function renderFromPicker() {
  const value = document.getElementById('startDate').value;
  const selected = value ? new Date(`${value}T00:00:00`) : new Date();
  const monday = getMondayOf(selected);
  document.getElementById('startDate').value = formatInputDate(monday);
  render(monday);
}

const initialMonday = getMondayOf(new Date());
document.getElementById('startDate').value = formatInputDate(initialMonday);
render(initialMonday);
</script>
</body>
</html>
